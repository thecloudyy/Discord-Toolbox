[package]
name = "discord-toolbox"
version = "1.0.6"
edition = "2021"
description = "Discord Toolbox — keep-online and game badge tooling for Discord."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "io-util", "time"] }
aes-gcm = "0.10"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
# Used by release builds so the frontend is embedded instead of loaded from devUrl.
custom-protocol = ["tauri/custom-protocol"]
